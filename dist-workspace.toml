[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
# Build archives independently of the hosted relay.
# Add download installers with `dist init` when preparing the first release.
ci = []
installers = []
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
unix-archive = ".tar.gz"
windows-archive = ".zip"
checksum = "sha256"
include = ["SECURITY.md", "CONTRIBUTING.md", "THIRD-PARTY-NOTICES.html", "docs"]
