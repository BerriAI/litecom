[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "all"
yanked = "deny"
# openidconnect uses RSA public keys to verify Google's signatures. Litecom
# never performs RSA private-key operations outside its public-key test fixture.
# Reassess this exception before adding RSA signing or decryption.
ignore = [{ id = "RUSTSEC-2023-0071", reason = "Private-key timing leakage is not reachable: production uses public-key verification only; see SECURITY.md." }]

[licenses]
include-dev = true
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# Unmodified transitive dependency of directories. Its source and license are
# linked in the notices distributed with every binary.
exceptions = [{ crate = "option-ext@0.2.0", allow = ["MPL-2.0"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
