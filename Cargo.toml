[package]
name = "litecom"
version = "0.1.0-alpha.23"
edition = "2024"
rust-version = "1.88"
description = "Ask someone's agent. They approve. It gets done."
repository = "https://github.com/BerriAI/litecom"
license = "MIT"
readme = "README.md"

[dependencies]
a2a-protocol-types = "0.14.1"
aes-gcm = "0.10"
agent-client-protocol = "3.3.0"
agentchat-core = { git = "https://github.com/BerriAI/agentchat", rev = "2d4f1eeffc73669db6be83c919241ea872d383a5" }
agentchat-slack = { git = "https://github.com/BerriAI/agentchat", rev = "2d4f1eeffc73669db6be83c919241ea872d383a5" }
anyhow = "1"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8", features = ["form", "json", "macros", "multipart"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.12"
directories = "6"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde_json"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
mail-parser = "0.11.9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
rmcp = { version = "3.5.1", features = ["transport-io", "client", "transport-child-process"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tokio-util = { version = "0.7", features = ["compat", "io"] }
tower-http = { version = "0.6", features = ["limit", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
fs2 = "0.4.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true

[profile.dist]
inherits = "release"
