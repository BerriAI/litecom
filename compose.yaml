name: litecom
services:
  relay:
    build: .
    image: litecom:local
    command: [relay, --listen, "0.0.0.0:4141", --public-url, "https://${LITECOM_HOST:?Set LITECOM_HOST in .env}", --data, "${LITECOM_DATA_DIR:-/data/relay}"]
    environment:
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_ALLOWED_DOMAINS: "${GOOGLE_ALLOWED_DOMAINS:-}"
      AGENTPHONE_API_KEY: "${AGENTPHONE_API_KEY:-}"
      AGENTPHONE_AGENT_ID: "${AGENTPHONE_AGENT_ID:-}"
      AGENTPHONE_NUMBER_ID: "${AGENTPHONE_NUMBER_ID:-}"
      AGENTPHONE_WEBHOOK_SECRET: "${AGENTPHONE_WEBHOOK_SECRET:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_REPLY_TO: "${SMTP_REPLY_TO:-}"
      IMAP_HOST: "${IMAP_HOST:-}"
      IMAP_PORT: "${IMAP_PORT:-993}"
      IMAP_USERNAME: "${IMAP_USERNAME:-}"
      IMAP_PASSWORD: "${IMAP_PASSWORD:-}"
      SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET:-}"
      SLACK_CLIENT_ID: "${SLACK_CLIENT_ID:-}"
      SLACK_CLIENT_SECRET: "${SLACK_CLIENT_SECRET:-}"
      SLACK_AGENT_BASE_URL: "${SLACK_AGENT_BASE_URL:-}"
      SLACK_AGENT_MODEL: "${SLACK_AGENT_MODEL:-}"
      SLACK_AGENT_API_KEY: "${SLACK_AGENT_API_KEY:-}"
    volumes:
      - relay-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "4", "http://127.0.0.1:4141/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  https:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      LITECOM_HOST: "${LITECOM_HOST:?Set LITECOM_HOST in .env}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL in .env}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  relay-data:
  caddy-data:
  caddy-config:
